# ---- Taxonomies ------------------------------------------------------------

[taxonomies]
  tag    = "tags"
  topic  = "topics"

# ---- Privacy ---------------------------------------------------------------

[privacy]
  [privacy.youtube]
    privacyEnhanced = true

# ---- Build -----------------------------------------------------------------

[build]
  writeStats = false

[minify]
  minifyOutput = true
