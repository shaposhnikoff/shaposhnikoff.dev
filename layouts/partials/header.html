<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Home">
      <span class="brand__sigil" aria-hidden="true"></span>
      <span>shaposhnikoff<span class="brand__caret">.dev</span></span>
    </a>

    <button class="nav-burger" data-nav-burger aria-label="Toggle navigation" aria-controls="nav">[≡]</button>

    <nav class="nav" id="nav" aria-label="Main">
      {{- $current := . -}}
      {{- range .Site.Menus.main }}
        {{- $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) -}}
        <a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle color theme">
        <svg class="icon-moon"  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun"   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </nav>
  </div>
</header>
