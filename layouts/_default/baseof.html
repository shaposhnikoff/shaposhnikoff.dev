<!DOCTYPE html>
<html lang="en" {{ with .Site.Params.defaultTheme }}{{ if ne . "auto" }}data-theme="{{ . }}"{{ end }}{{ end }}>
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "header.html" . -}}
  <main id="main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</body>
</html>
