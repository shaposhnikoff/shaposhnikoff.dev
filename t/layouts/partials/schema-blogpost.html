<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify }},
  "description": {{ or .Description .Summary | plainify | truncate 200 | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02" | jsonify }},
  "dateModified":  {{ .Lastmod.Format "2006-01-02" | jsonify }},
  "url": {{ .Permalink | jsonify }},
  "mainEntityOfPage": {{ .Permalink | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ .Site.Params.author | jsonify }},
    "url":  {{ .Site.BaseURL | jsonify }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ .Site.Params.author | jsonify }}
  }
  {{- with .Params.tags }},"keywords": {{ delimit . ", " | jsonify }}{{ end }}
}
</script>
